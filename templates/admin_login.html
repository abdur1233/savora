<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Admin Login | Savora</title>
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
          rel="stylesheet">
 
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
 
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
 
        body {
            font-family: "DM Sans", sans-serif;
            background: #fff8f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
 
        .login-card {
            background: #fff;
            width: min(380px, 90%);
            padding: 40px 32px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(30,20,10,.1);
            border: 1px solid #ece8e4;
        }
 
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 8px;
        }
 
        .brand-icon {
            width: 40px;
            height: 40px;
            background: #f25c05;
            color: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
 
        .brand span {
            font-family: "Playfair Display", serif;
            font-size: 22px;
            font-weight: 800;
        }
 
        h1 {
            text-align: center;
            font-size: 15px;
            color: #929292;
            font-weight: 500;
            margin-bottom: 28px;
        }
 
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #181818;
        }
 
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ece8e4;
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
        }
 
        input:focus {
            border-color: #f25c05;
            box-shadow: 0 0 0 3px rgba(242,92,5,.1);
        }
 
        button {
            width: 100%;
            padding: 13px;
            background: #f25c05;
            color: #fff;
            border: none;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: .3s;
        }
 
        button:hover {
            background: #d94d00;
        }
 
        .error-msg {
            background: #fde8e5;
            color: #c0392b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>
 
<body>
 
    <div class="login-card">
 
        <div class="brand">
            <span class="brand-icon"><i class="fa-solid fa-utensils"></i></span>
            <span>Savora</span>
        </div>
 
        <h1>Admin Panel Login</h1>
 
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
 
        <form method="POST">
 
            <label>Username</label>
            <input type="text" name="username" autocomplete="username" required autofocus>
 
            <label>Password</label>
            <input type="password" name="password" autocomplete="current-password" required>
 
            <button type="submit">Login</button>
 
        </form>
 
    </div>
 
</body>
</html>
